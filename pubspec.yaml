name: bierliste
description: "Bierlisten App."
publish_to: 'none'
version: 1.0.11

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.0
  http: ^1.6.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  animated_list_plus: ^0.5.2
  intl: ^0.20.3
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  flutter_dotenv: ^6.0.2
  flutter_secure_storage: ^11.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^7.3.2
  app_links: ^7.2.2
  qr_flutter: ^4.1.0
  package_info_plus: ^10.2.2
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  flutter_local_notifications: ^23.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/bierliste_icon.png"

flutter_native_splash:
  color: "#2A2A2A"
  image: "assets/bierliste_logo_kreis_padding.png"
  android: true
  ios: true
  fullscreen: true
  
  android_12:
    color: "#2A2A2A"
    image: "assets/bierliste_logo_kreis_padding.png"
    icon_background_color: "#2A2A2A"
